description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "efficientnet-pytorch>=0.7.1",
    "einops>=0.8.1",
    "fastapi>=0.116.1",
    "matplotlib>=3.10.5",
    # AI-GENERATED-START
    "mkl>=2025.2.0; platform_system != 'Darwin' or platform_machine != 'arm64'",
    # AI-GENERATED-END
    "onnx>=1.18.0",
    "onnxruntime>=1.22.1",
    "pillow>=11.3.0",
    "psutil>=7.0.0",
    "pydantic>=2.11.7",
    "requests>=2.32.4",
    "setuptools>=80.9.0",
    "timm>=1.0.19",
    "torch",
    "torchaudio",
    "torchsummary",
    "torchvision",
    "ultralytics>=8.3.178",
    "uvicorn>=0.35.0",
    "yacs>=0.1.8",
